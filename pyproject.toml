[tool.poetry]
name = "niftivis"
version = "2021.04.13"
description = "Convert NIFTI to PNG in various ways."
authors = ["Jon Stutters <j.stutters@ucl.ac.uk>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
nibabel = "^5.3.2"
pillow = "^12.3.0"
scikit-image = "^0.25.2"
click = "^8.3.3"
numpy = ">=2.2,<2.5"

[tool.poetry.dev-dependencies]
flake8 = "^3.7.9"
pylint = "^2.5.3"

[tool.poetry.scripts]
niftivis = "niftivis.niftivis:make_thumbnails"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
